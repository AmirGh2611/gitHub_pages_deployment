name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
    # نکته کلیدی: فقط زمانی trigger می‌شود که فایل index.html تغییر کند
    paths:
      - 'index.html'
  workflow_dispatch: # امکان اجرای دستی را هم اضافه می‌کند

# مجوزهای لازم برای استقرار در GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# اطمینان از اینکه فقط یک استقرار همزمان انجام می‌شود
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # چون فایل index.html در ریشه قرار دارد، از ریشه آپلود می‌کنیم
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4